<style>
  :root {
    --bg: #07080A;
    --t-head: rgba(255,255,255,0.97);
    --t-body: rgba(255,255,255,0.90);
    --t-sub: rgba(255,255,255,0.62);
    --t-meta: rgba(255,255,255,0.56);
    --t-dim: rgba(255,255,255,0.22);
    --line: rgba(255,255,255,0.12);
    --accent: #2962FF;
    --pad: 24px;
    --ease: cubic-bezier(0.215, 0.61, 0.355, 1);
    --sl: env(safe-area-inset-left, 0px);
    --sr: env(safe-area-inset-right, 0px);
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--t-body);
    font-family: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Source Han Sans SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.7;
    text-align: left;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding-left: calc(var(--pad) + var(--sl));
    padding-right: calc(var(--pad) + var(--sr));
  }
  header { padding-top: calc(40px + env(safe-area-inset-top, 0px)); padding-bottom: 24px; }
  h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: 0.02em;
    color: var(--t-head);
  }
  .meta-row {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 20px;
  }
  .updated {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    color: var(--t-sub);
    font-variant-numeric: tabular-nums;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex: none;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--t-meta);
    font-weight: 400;
    line-height: 1.5;
  }
  .date-pick { display: inline-flex; align-items: center; gap: 10px; position: relative; }
  .date-pick::after {
    content: ""; position: absolute; right: 3px; top: 50%;
    width: 5px; height: 5px; margin-top: -5px;
    border-right: 1px solid rgba(255,255,255,0.56); border-bottom: 1px solid rgba(255,255,255,0.56);
    transform: rotate(45deg); pointer-events: none;
  }
  select {
    appearance: none;
    -webkit-appearance: none;
    background: transparent;
    color: var(--t-body);
    border: 0;
    border-bottom: 1px solid var(--line);
    border-radius: 0;
    font: inherit;
    font-size: 14px;
    font-variant-numeric: tabular-nums;
    padding: 4px 18px 4px 0;
    cursor: pointer;
  }
  select:focus { outline: none; border-bottom-color: rgba(255,255,255,0.56); }
  select:disabled { color: var(--t-dim); cursor: default; }
  option { background: var(--bg); color: var(--t-body); }

  nav.tabs {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
    border-bottom: 1px solid var(--line);
  }
  .tabs .wrap { display: flex; gap: 28px; overflow-x: auto; scrollbar-width: none; }
  .tabs .wrap::-webkit-scrollbar { display: none; }
  .tab {
    appearance: none;
    background: none;
    border: 0;
    margin: 0;
    padding: 16px 0 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 400;
    color: var(--t-meta);
    white-space: nowrap;
    cursor: pointer;
    position: relative;
    transition: color 500ms var(--ease);
  }
  .tab::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: #fff;
    opacity: 0;
    transition: opacity 500ms var(--ease);
  }
  .tab[aria-selected="true"] { color: var(--t-head); }
  .tab[aria-selected="true"]::after { opacity: 1; }
  .tab:focus-visible { outline: 1px solid var(--line); outline-offset: 4px; }
  .tab .cnt { margin-left: 5px; font-size: 11px; color: var(--t-dim); font-variant-numeric: tabular-nums; transition: color 500ms var(--ease); }
  .tab[aria-selected="true"] .cnt { color: var(--t-meta); }
  .tab .cnt:empty { display: none; }
  nav.tabs::after {
    content: ""; position: absolute; right: 0; bottom: 1px; height: 50px; width: 40px;
    background: linear-gradient(to right, rgba(7,8,10,0), var(--bg) 75%);
    pointer-events: none; opacity: 0; transition: opacity 300ms var(--ease);
  }
  nav.tabs.more::after { opacity: 1; }

  main { padding-top: 8px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .card {
    padding: 32px 0;
    border-bottom: 1px solid var(--line);
  }
  .card:last-child { border-bottom: 0; }
  .card-top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 16px;
    margin-bottom: 10px;
  }
  .card h2 {
    margin: 0 0 10px;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.5;
    color: var(--t-head);
  }
  .card h2 a { color: inherit; text-decoration: none; }
  .card h2 a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .summary { margin: 0; color: var(--t-body); word-break: break-word; }
  .src {
    display: inline-block;
    margin-top: 14px;
    font-size: 13px;
    color: var(--t-sub);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    word-break: break-all;
  }
  .src:hover { color: var(--t-head); }
  .author { font-size: 15px; font-weight: 700; color: var(--t-head); }
  .author a { color: inherit; text-decoration: none; }
  .handle { font-size: 13px; color: var(--t-meta); }
  .rank { font-variant-numeric: tabular-nums; }
  .metrics {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    margin-top: 16px;
    font-variant-numeric: tabular-nums;
  }
  .metrics span b { font-weight: 400; color: var(--t-sub); margin-left: 6px; }
  .num { font-variant-numeric: tabular-nums; }
  .gh-name { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px !important; letter-spacing: -0.01em; }
  .gh-title { margin: 0 0 10px; font-size: 15px; font-weight: 600; color: var(--t-head); }
  .empty, .error {
    padding: 64px 0;
    color: var(--t-meta);
    font-size: 15px;
  }

  /* ---- 金融简报 ---- */
  .fin-head { padding: 32px 0 28px; }
  .fin-title {
    margin: 0 0 12px;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.45;
    color: var(--t-head);
  }
  .fin-cutoff { margin: 0; font-size: 13px; color: var(--t-sub); font-variant-numeric: tabular-nums; }
  .fin-note { margin: 4px 0 0; font-size: 13px; color: var(--t-meta); }
  .fin-sec { padding: 28px 0; border-top: 1px solid var(--line); }
  .fin-sec > .label { display: block; margin: 0 0 14px; }
  .fin-p { margin: 0; color: var(--t-body); word-break: break-word; }
  .fin-list { list-style: none; margin: 0; padding: 0; }
  .fin-miss li { padding: 6px 0; word-break: break-word; }
  .fin-miss .r { color: var(--t-meta); font-size: 14px; }
  .fin-three li { display: flex; gap: 14px; padding: 10px 0; }
  .fin-three .n { flex: none; width: 18px; padding-top: 1px; font-size: 13px; color: var(--t-meta); font-variant-numeric: tabular-nums; }
  .fin-three b { display: block; font-weight: 700; color: var(--t-head); }
  .fin-three p { margin: 2px 0 0; color: var(--t-sub); font-size: 15px; word-break: break-word; }
  .snap li { padding: 12px 0; border-bottom: 1px solid var(--line); }
  .snap summary, .fin-more > summary, .sec-head > summary { list-style: none; cursor: pointer; }
  .snap summary::-webkit-details-marker, .fin-more > summary::-webkit-details-marker, .sec-head > summary::-webkit-details-marker { display: none; }
  .snap-sub { margin-top: 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12px; color: var(--t-meta); font-variant-numeric: tabular-nums; }
  .snap details[open] .snap-meta { margin-top: 8px; }
  .chev {
    display: inline-block; width: 5px; height: 5px; margin-left: 2px;
    border-right: 1px solid currentColor; border-bottom: 1px solid currentColor;
    transform: translateY(-2px) rotate(45deg); transition: transform 300ms var(--ease);
  }
  details[open] > summary .chev { transform: translateY(1px) rotate(-135deg); }
  .snap li:first-child { padding-top: 0; }
  .snap li:last-child { border-bottom: 0; padding-bottom: 0; }
  .snap-top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 16px; flex-wrap: wrap; }
  .snap-asset { font-size: 15px; color: var(--t-head); }
  .snap-val { font-variant-numeric: tabular-nums; color: var(--t-body); white-space: nowrap; }
  .snap-val .chg { margin-left: 10px; color: var(--t-sub); }
  .snap-meta { margin-top: 4px; font-size: 13px; color: var(--t-meta); font-variant-numeric: tabular-nums; }
  .snap-meta a, .fin-srcs a, .fin-evsrc a {
    color: var(--t-sub);
    text-decoration: none;
    border-bottom: 1px solid var(--line);
    word-break: break-word;
  }
  .snap-meta a:hover, .fin-srcs a:hover, .fin-evsrc a:hover { color: var(--t-head); }
  .snap-reason { margin-top: 4px; font-size: 13px; color: var(--t-meta); word-break: break-word; }
  .fin-item { padding: 24px 0; border-bottom: 1px solid var(--line); }
  .fin-item:first-of-type { padding-top: 0; }
  .fin-item:last-child { border-bottom: 0; padding-bottom: 0; }
  .fin-item h3 { margin: 0 0 14px; font-size: 18px; font-weight: 700; line-height: 1.5; color: var(--t-head); }
  .fin-item h3 .n { font-variant-numeric: tabular-nums; margin-right: 8px; }
  .fin-dl { margin: 0; }
  .fin-dl dt { margin-top: 14px; }
  .fin-dl dt:first-child { margin-top: 0; }
  .fin-dl dd { margin: 2px 0 0; color: var(--t-body); word-break: break-word; }
  .fin-tag { color: var(--t-meta); margin-right: 10px; }
  .fin-more { margin-top: 14px; }
  .fin-more > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 0; font-size: 13px; color: var(--t-sub); }
  .fin-more > summary .fin-tag { margin-right: 0; }
  .fin-more[open] > summary { margin-bottom: 6px; }
  .fin-srcs { font-size: 13px; color: var(--t-meta); }
  .fin-srcs div { padding: 2px 0; }
  .fin-grade { color: var(--t-meta); }
  .fin-ev li { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .fin-ev li:first-child { padding-top: 0; }
  .fin-ev li:last-child { border-bottom: 0; }
  .fin-ev .ev { margin: 2px 0 0; color: var(--t-body); word-break: break-word; }
  .fin-ev .w { margin: 2px 0 0; color: var(--t-sub); font-size: 14px; word-break: break-word; }
  .fin-evsrc { margin-top: 10px; font-size: 13px; color: var(--t-meta); }
  .fin-evsrc div { padding: 2px 0; }
  .fin-foot { padding: 28px 0 0; border-top: 1px solid var(--line); font-size: 13px; color: var(--t-meta); }

  @media (max-width: 480px) {
    header { padding-top: calc(28px + env(safe-area-inset-top, 0px)); padding-bottom: 14px; }
    h1 { font-size: 26px; }
    .meta-row { margin-top: 10px; }
    .card { padding: 26px 0; }
  }
  @media (max-width: 400px) {
    .tabs .wrap { gap: 20px; }
    .tab { font-size: 14px; }
  }

  .js .fade {
    opacity: 0;
    transform: translate(var(--dx, 0px), 8px);
    animation: rise 500ms var(--ease) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .js .fade { animation: none; opacity: 1; transform: none; }
    .tab, .tab::after { transition: none; }
  }
  .sec-head { margin: 4px 0 10px; font-size: 13px; color: var(--t-meta); line-height: 1.6; font-variant-numeric: tabular-nums; }
  .sec-head b { color: var(--t-sub); font-weight: 500; }
  .sec-head > summary { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; padding: 10px 0; }
  .sec-head > summary .warn { color: var(--t-sub); }
  .sec-head > summary .more { margin-left: auto; color: var(--t-sub); }
  .sec-head .body { padding: 2px 0 12px; }
  .sec-head .body > div + div, .sec-head .body > div + ul { margin-top: 6px; }
  .sec-head .miss { margin: 4px 0 0; padding: 0; list-style: none; }
  .sec-head .miss li { padding: 2px 0; color: var(--t-sub); }
  .sec-head .miss .r { color: var(--t-meta); }
  .sec-note { margin-top: 6px; color: var(--t-sub); }
  .blk { margin: 0 0 22px; padding: 14px 0 0; border-top: 1px solid var(--line); }
  .blk h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; color: var(--t-meta); font-weight: 500; }
  .blk ul { margin: 0; padding: 0; list-style: none; }
  .blk li { font-size: 14px; color: var(--t-sub); line-height: 1.6; margin-bottom: 8px; }
  .blk li .r { display:block; font-size:12px; color: var(--t-meta); margin-top:2px; }
  .blk li a { color: var(--t-sub); text-decoration: none; }
  .blk summary { cursor:pointer; list-style:none; font-size:12px; letter-spacing:.08em; color:var(--t-meta); font-weight:500; margin:0 0 8px; }
  .blk summary::-webkit-details-marker { display:none; }
  .lab-h { margin: 26px 0 4px; font-size: 12px; letter-spacing: .12em; color: var(--t-meta); font-weight: 500; text-transform: uppercase; }
  .lab-h:first-child { margin-top: 0; }
  .lab-h + .card { padding-top: 14px; }
  .times { margin-top: 10px; font-size: 12px; color: var(--t-meta); font-variant-numeric: tabular-nums; }
  .srcline { margin-top: 6px; font-size: 12px; color: var(--t-meta); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .srcline a { color: var(--t-sub); }
  .tag { border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; font-size: 11px; color: var(--t-sub); }
  .xc-ok::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--t-sub); margin-right: 5px; vertical-align: 1px; }
  .conflict { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; font-size: 12px; color: var(--t-sub); line-height: 1.6; }
  .conflict .row { display: flex; justify-content: space-between; gap: 10px; }
  .conflict .why { margin-top: 4px; color: var(--t-meta); }
  .conflict .row > * { min-width: 0; word-break: break-word; }
  .conflict .row a { text-align: right; }
  .conflict a, .blk li a {
    color: var(--t-sub); text-decoration: none;
    border-bottom: 1px solid var(--line);
  }
  .conflict a:hover, .blk li a:hover { color: var(--t-head); }
  .arrow { color: var(--t-sub); margin-right: 3px; font-size: 10px; }
  .srcline a, .snap-meta a, .fin-srcs a { padding: 4px 0; }
  .blk summary { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
  .blk li b { color: var(--t-body); font-weight: 500; margin-right: 6px; }
  .card.compact { padding: 20px 0; }
  .card.compact .author { font-size: 14px; }
  .see {
    appearance: none; background: none; border: 0; padding: 6px 0; margin: 4px 0 0;
    font: inherit; font-size: 14px; color: var(--t-sub); cursor: pointer; text-align: left;
  }
  .see:hover { color: var(--t-head); }
  .card.compact .metrics { margin-top: 6px; }
  .card.is-seen .summary { color: var(--t-sub); }
  [data-url] { scroll-margin-top: 72px; }
  .flash { animation: flash 1800ms var(--ease); }
  @keyframes flash { 0%, 30% { background: rgba(255,255,255,0.06); } 100% { background: transparent; } }
  .toast {
    position: fixed; left: 50%; z-index: 20;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
    appearance: none; border: 1px solid var(--line); border-radius: 999px;
    background: #14161A; color: var(--t-head);
    font: inherit; font-size: 14px; white-space: nowrap;
    padding: 11px 20px; cursor: pointer;
    transition: opacity 400ms var(--ease), transform 400ms var(--ease);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.topic-post{border-left:1px solid #2a2d33;padding:6px 0 6px 10px;margin:10px 0}
.topic-post .metrics{margin-top:6px}
.topic-post>a{display:inline-block;margin-top:6px;color:#9aa0a6;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<header class="wrap">
  <h1>AI 日报</h1>
  <div class="meta-row">
    <div class="updated"><span class="dot" aria-hidden="true"></span><span id="updated">加载中…</span></div>
    <label class="date-pick"><span class="label">日期</span><select id="date" aria-label="选择日期" disabled></select></label>
  </div>
</header>

<nav class="tabs" aria-label="栏目">
  <div class="wrap" role="tablist">
    <button class="tab" role="tab" data-tab="ai_labs" aria-selected="true">大厂动态<span class="cnt"></span></button>
    <button class="tab" role="tab" data-tab="x_top" aria-selected="false">X 热点</button>
    <button class="tab" role="tab" data-tab="filecoin" aria-selected="false">Filecoin<span class="cnt"></span></button>
    <button class="tab" role="tab" data-tab="finance" aria-selected="false">金融简报</button>
    <button class="tab" role="tab" data-tab="github_tools" aria-selected="false">GitHub 工具<span class="cnt"></span></button>
  </div>
</nav>

<main class="wrap" id="main" role="tabpanel" aria-live="polite"><noscript><p class="empty">本页需要 JavaScript 渲染；原始数据见 <a href="data/latest.json">data/latest.json</a>。</p></noscript></main>
<button class="toast" id="toast" type="button" aria-live="polite"></button>

<script>
(function () {
  'use strict';

  var state = { data: null, tab: 'ai_labs', latestDate: null, dates: [], reqId: 0, prev: null, scroll: {} };
  var $main = document.getElementById('main');
  var $updated = document.getElementById('updated');
  var $date = document.getElementById('date');
  var $header = document.querySelector('header');
  var $nav = document.querySelector('nav.tabs');
  var $strip = $nav.querySelector('.wrap');
  var $toast = document.getElementById('toast');
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var asOf = null; // 当前栏目的数据截至时间；卡片抓取时间与之相同时不重复显示

  var EMPTY = {
    ai_labs: '今日暂无大厂动态',
    x_top: '今日暂无 X 热门话题',
    filecoin: '今日暂无 Filecoin 相关动态',
    finance: '今日暂无金融简报',
    github_tools: '今日暂无 GitHub 工具推荐'
  };

  // ---- helpers (no innerHTML with data; everything via textContent) ----
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null && text !== '') n.textContent = String(text);
    return n;
  }
  function safeUrl(u) {
    if (typeof u !== 'string') return null;
    try {
      var p = new URL(u, location.href);
      return (p.protocol === 'https:' || p.protocol === 'http:') ? p.href : null;
    } catch (e) { return null; }
  }
  function link(href, cls, text) {
    var url = safeUrl(href);
    if (!url) return el('span', cls, text);
    var a = el('a', cls, text);
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    return a;
  }
  function str(v) { return v == null ? '' : String(v); }

    if (state.tab === 'x_top') {
      items = items.slice().sort(function (a, b) { return (Number(a.rank) || 99) - (Number(b.rank) || 99); });
      arr(secs.ai_labs).forEach(function (it) { if (it && it.source_url && !it.status_card) ctx.labUrls[it.source_url] = str(it.lab); });
    }
    var status = [];
    if (state.tab === 'ai_labs') {
      status = items.filter(function (it) { return it.status_card; });
      items = items.filter(function (it) { return !it.status_card; });
    }
    var out = [secHead(M, true)];
    var sb = statusBlock(status); if (sb) out.push(sb);
    if (!items.length) out.push(el('div', 'empty fade', EMPTY[state.tab]));
    var ul = el('ul', 'list'), lastLab = null;
    items.forEach(function (it, i) {
      if (state.tab === 'ai_labs' && it.lab !== lastLab) { lastLab = it.lab; ul.appendChild(el('li', 'lab-h', it.lab)); }
      ul.appendChild(RENDER[state.tab](it, i, ctx));
    });
    if (items.length) out.push(ul);
    if (M && M.overflow && M.overflow.length) out.push(pendBlock(M.overflow.map(function (x) { return Object.assign({}, x, { pending_reason: x.lab + ' 当日第 4 条及以后' }); }), '同公司更多条目'));
    var pb = M && pendBlock(M.pending, '待验证（超过 72 小时 / 无完整日期 / 未证实，不计入正文）'); if (pb) out.push(pb);
    $main.replaceChildren.apply($main, out);
    annotateSeen();
  }

  function setCounts() {
    var secs = (state.data && state.data.sections) || {};
    tabs.forEach(function (b) {
      var c = b.querySelector('.cnt'); if (!c) return;
      var n = arr(secs[b.dataset.tab]).filter(function (it) { return it && !it.status_card; }).length;
      c.textContent = n ? String(n) : '';
    });
    edgeHint();
  }

  function setData(d) {
    state.data = d || {};
    var t = beijing(state.data.updated_at);
    // 事后补充：顶层 revised_at，或任一栏目截至时间晚于首发时间
    var rev = beijing(state.data.revised_at);
    if (!rev && t) {
      var meta = state.data.meta || {};
      Object.keys(meta).forEach(function (k) { var a = meta[k] && meta[k].as_of; if (typeof a === 'string' && a > t && (!rev || a > rev)) rev = a; });
    }
    $updated.textContent = t ? '更新于 ' + t + (rev ? ' · 补充于 ' + rev : '') + '（北京时间）' : '更新时间未知';
    if (state.data.date && $date.value !== state.data.date) {
      ensureOption(state.data.date);
      $date.value = state.data.date;
    }
    setCounts();
    loadPrev(state.data.date); // 先清掉上一份对比数据，再渲染
    render();
  }

  function ensureOption(d) {
    for (var i = 0; i < $date.options.length; i++) if ($date.options[i].value === d) return;
    var o = el('option', '', d); o.value = d;
    $date.insertBefore(o, $date.firstChild);
    $date.disabled = false;
  }
  function setDates(dates) {
    state.dates = dates;
    var cur = $date.value;
    var frag = document.createDocumentFragment();
    dates.forEach(function (d) { var o = el('option', '', d); o.value = d; frag.appendChild(o); });
    $date.replaceChildren(frag);
    if (cur) { ensureOption(cur); $date.value = cur; }
    $date.disabled = dates.length === 0;
    state.latestDate = dates[0] || null;
  }

  function getJSON(url, opts) {
    return fetch(url, opts).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function contentTop() { return $header.offsetHeight; }

  function loadDate(d) {
    var id = ++state.reqId;
    state.scroll = {};
    if (window.scrollY > contentTop()) window.scrollTo(0, contentTop());
    message('empty', '加载中…');
    var url = 'data/' + encodeURIComponent(d) + '.json';
    getJSON(url, d === state.latestDate ? { cache: 'no-cache' } : undefined)
      .then(function (data) { if (id === state.reqId) setData(data); })
      .catch(function () { if (id === state.reqId) message('error', '无法加载 ' + d + ' 的日报'); });
  }

  // ---- tabs ----
  function edgeHint() {
    $nav.classList.toggle('more', $strip.scrollWidth - $strip.clientWidth - $strip.scrollLeft > 4);
  }
  function syncTabs(smooth) {
    tabs.forEach(function (x) {
      var on = x.dataset.tab === state.tab;
      x.setAttribute('aria-selected', on ? 'true' : 'false');
      x.tabIndex = on ? 0 : -1;
      if (on) {
        var left = x.offsetLeft - $strip.offsetLeft - ($strip.clientWidth - x.offsetWidth) / 2;
        try { $strip.scrollTo({ left: Math.max(0, left), behavior: smooth ? 'smooth' : 'auto' }); } catch (e) { $strip.scrollLeft = Math.max(0, left); }
      }
    });
  }
  // dir：1 从右滑入，-1 从左滑入，0 原地
  function switchTab(tab, dir) {
    if (state.tab === tab) return;
    state.scroll[state.tab] = window.scrollY;
    state.tab = tab;
    syncTabs(true);
    if (history.replaceState) history.replaceState(null, '', '#' + tab); else location.hash = tab;
    $main.style.setProperty('--dx', (dir || 0) * 16 + 'px');
    render();
    var top = contentTop(), y = state.scroll[tab];
    window.scrollTo(0, y != null ? y : Math.min(window.scrollY, top));
  }
  function goTo(tab, url) {
    switchTab(tab, 0);
    var hit = null;
    Array.prototype.forEach.call($main.querySelectorAll('[data-url]'), function (n) { if (!hit && n.getAttribute('data-url') === url) hit = n; });
    if (!hit) return;
    hit.scrollIntoView({ block: 'start' });
    hit.classList.remove('flash'); void hit.offsetWidth; hit.classList.add('flash');
  }
  function tabIndex() { for (var i = 0; i < tabs.length; i++) if (tabs[i].dataset.tab === state.tab) return i; return 0; }

  tabs.forEach(function (b, i) {
    b.addEventListener('click', function () {
      if (state.tab === b.dataset.tab) {           // 再点当前栏目：回到栏目顶部，已在顶部则回到页首
        var top = contentTop();
        window.scrollTo({ top: window.scrollY > top + 4 ? top : 0, behavior: 'smooth' });
        return;
      }
      var cur = tabIndex();
      switchTab(b.dataset.tab, i > cur ? 1 : -1);
    });
    b.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var n = (i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length;
      tabs[n].focus(); tabs[n].click();
    });
  });
  $strip.addEventListener('scroll', edgeHint, { passive: true });
  window.addEventListener('resize', edgeHint);

  // 手机左右滑动切换栏目（避开屏幕边缘的系统返回手势）
  (function () {
    var sx = 0, sy = 0, st = 0, on = false;
    $main.addEventListener('touchstart', function (e) {
      if (e.touches.length !== 1) { on = false; return; }
      var t = e.touches[0];
      sx = t.clientX; sy = t.clientY; st = Date.now();
      on = sx > 24 && sx < window.innerWidth - 24;
    }, { passive: true });
    $main.addEventListener('touchend', function (e) {
      if (!on) return; on = false;
      var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
      if (Date.now() - st > 700 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
      if (window.getSelection && String(window.getSelection())) return;
      var n = tabIndex() + (dx < 0 ? 1 : -1);
      if (n < 0 || n >= tabs.length) return;
      switchTab(tabs[n].dataset.tab, dx < 0 ? 1 : -1);
    }, { passive: true });
  })();

  function fromHash() {
    var h = (location.hash || '').slice(1);
    tabs.forEach(function (x) { if (x.dataset.tab === h) state.tab = h; });
    syncTabs(false);
  }
  fromHash();
  window.addEventListener('hashchange', function () { fromHash(); render(); });
  $date.addEventListener('change', function () { if ($date.value) loadDate($date.value); });

  // ---- 更新提示 ----
  function showToast(text, onTap) {
    $toast.textContent = text;
    $toast.onclick = function () { $toast.classList.remove('show'); onTap(); };
    $toast.classList.add('show');
  }

  // ---- boot ----
  var idxP = getJSON('data/index.json', { cache: 'no-cache' }).then(function (idx) {
    var dates = arr(idx && idx.dates).filter(function (x) { return typeof x === 'string'; });
    setDates(dates);
    return dates;
  }).catch(function () { return []; });

  var latestId = ++state.reqId;
  message('empty', '加载中…');
  getJSON('data/latest.json', { cache: 'no-cache' }).then(function (data) {
    return idxP.then(function () {
      if (latestId !== state.reqId) return;
      if (data && data.date) state.latestDate = state.latestDate || data.date;
      setData(data);
    });
  }).catch(function () {
    idxP.then(function (dates) {
      if (latestId !== state.reqId) return;
      if (dates.length) { loadDate(dates[0]); }
      else { $updated.textContent = '暂无数据'; message('error', '无法加载日报，请稍后重试'); }
    });
  });

  if ('serviceWorker' in navigator) {
    var hadController = !!navigator.serviceWorker.controller;
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) { reg.update(); document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') reg.update(); }); }).catch(function () {});
      // 新版本就绪：后台时直接刷新；正在看时给提示，不打断阅读。首次安装不刷新。
      var reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadController) { hadController = true; return; }
        if (reloaded) return;
        if (document.visibilityState !== 'visible') { reloaded = true; location.reload(); return; }
        getJSON('data/index.json', { cache: 'no-cache' }).then(function (idx) {
          var d = arr(idx && idx.dates)[0];
          return d && d !== state.latestDate ? d + ' 日报已发布 · 点此查看' : '页面有更新 · 点此刷新';
        }).catch(function () { return '页面有更新 · 点此刷新'; }).then(function (text) {
          showToast(text, function () { reloaded = true; location.reload(); });
        });
      });
    });
  }
})();
</script>
</body>
</html>
